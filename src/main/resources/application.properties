spring.application.name=star-recommendation

# Основная БД (чтение/запись): динамические правила рекомендаций.
# PostgreSQL, таблицы создаёт только Liquibase.
# Значения можно переопределить переменными окружения SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/star_recommendation
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=star
spring.datasource.password=star

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Telegram-бот включается только при наличии токена: переменная окружения TELEGRAM_BOT_TOKEN
# (или свойство telegram.bot.token, например в application-local.properties). Здесь токен не хранится.

# База знаний о клиентах (встраиваемая H2, только чтение).
# Настраивается отдельно, см. DataSourceConfiguration.
application.recommendations-db.url=jdbc:h2:file:./transaction
application.recommendations-db.driver-class-name=org.h2.Driver
